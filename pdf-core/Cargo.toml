[package]
name = "pivot-pdf"
version = "0.7.0"
edition = "2021"
description = "A low-overhead PDF generation library for reports, invoices, and documents"
license = "MIT"
repository = "https://github.com/pivotpdftools/pivot-pdf"
readme = "../README.md"
keywords = ["pdf", "pdf-generation", "report", "document"]
categories = ["text-processing", "rendering"]
authors = ["Rob Apodaca <rob.apodaca@gmail.com>"]
exclude = ["/pdf-php/**/*", "/composer.json", "/scripts/post-install.php", "/.claude/**/*", "/.github/**/*", "/pdf-cli/**/*"]

[dependencies]
flate2 = "1"
png = "0.17"
ttf-parser = "0.25"
