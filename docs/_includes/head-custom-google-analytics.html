<!-- Google tag (gtag.js) - GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{ site.google_analytics }}', {
    'cookie_domain': location.hostname,          // Uses full hostname (e.g., pivotpdftools.github.io) to avoid "invalid domain" rejection
    'cookie_flags': 'SameSite=None;Secure'       // Enhances compatibility in strict browsers
  });
</script>
